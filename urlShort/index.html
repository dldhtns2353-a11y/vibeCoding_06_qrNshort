<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL 단축기</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="../img/logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
        <a href="../index.html" class="back-link">← 메인으로 돌아가기</a>
    </header>

    <main class="container">
        <h1>URL 단축기</h1>
        
        <div class="input-section">
            <input type="text" id="long-url" placeholder="단축할 URL을 입력하세요 (예: https://example.com)" />
            <button id="shorten-btn" disabled>단축하기</button>
        </div>

        <div class="output-section">
            <input type="text" id="short-url" readonly placeholder="단축된 URL이 여기에 표시됩니다" />
            <button id="copy-btn">복사</button>
        </div>
        
        <div id="toast" class="toast">복사하였습니다</div>
    </main>

    <script src="script.js?v=2"></script>
</body>
</html>
