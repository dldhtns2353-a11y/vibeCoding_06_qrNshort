<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR 코드 생성기</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 20px;">
        <img src="../img/logo.png" alt="Logo" class="logo">
        <a href="../" style="text-decoration: none; font-weight: 600; color: #4F46E5;">← 메인으로 돌아가기</a>
    </header>

    <main class="container">
        <div id="qr-container">
            <div id="qrcode" title="클릭하여 다운로드"></div>
            <p class="instruction">QR 코드를 클릭하여 JPG로 다운로드하세요</p>
        </div>

        <div class="input-container" id="input-container">
            <input type="text" id="url-input" placeholder="URL을 입력하세요 (예: https://example.com)" />
            <button id="generate-btn">생성</button>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js?v=2"></script>
</body>
</html>
